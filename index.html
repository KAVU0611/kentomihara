<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kento Mihara | AI Engineer</title>
    <meta property="og:title" content="Kento Mihara" />
    <meta property="og:site_name" content="Kento.M" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Atmospheric Glass design system
              glass: {
                50:  '#dae2fd',
                100: '#c4c7c8',
                200: '#8e9192',
                300: '#444748',
                400: '#2d3449',
                500: '#222a3d',
                600: '#171f33',
                700: '#131b2e',
                800: '#0b1326',
                900: '#060e20',
              },
              accent: {
                100: '#d0e4ff',
                200: '#adc9eb',
                300: '#9fbbdd',
                400: '#304b68',
                500: '#2d4965',
                600: '#14324e',
              },
            },
            fontFamily: {
              sans: ['Inter', '"Noto Sans JP"', 'system-ui', 'sans-serif'],
              display: ['Inter', '"Noto Sans JP"', 'sans-serif'],
            },
            keyframes: {
              'fade-in-up': {
                '0%':   { opacity: '0', transform: 'translateY(24px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'bounce-slow': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%':      { transform: 'translateY(-10px)' },
              },
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.8s ease-out forwards',
              'bounce-slow': 'bounce-slow 3.5s ease-in-out infinite',
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
      body {
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      }
      .glass-card-elevated {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      html {
        scroll-behavior: smooth;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body class="bg-glass-800 text-glass-50 antialiased selection:bg-accent-200 selection:text-glass-800">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
